#
# joy_bridge application config. Target board: esp32s3_devkitc.

# ---- C library / heap -------------------------------------------------------
# The ported codec/controller use malloc()/free(); give libc a real arena.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768
CONFIG_CPP=n

# ESP32-S3 external PSRAM: disabled for initial bring-up. The octal-mode config
# carried over from the Hello World overlay hangs early SoC init on boards
# without octal PSRAM. Not required by the app. Re-enable with the correct mode
# (quad vs octal) once the board PSRAM variant is confirmed.
# CONFIG_ESP_SPIRAM=y
# CONFIG_SPIRAM_MODE_OCT=y

# ---- Logging ----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_JOY_BRIDGE_LOG_LEVEL_INF=y

# ---- Bluetooth host ---------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_DEVICE_NAME="Pro Controller 2"

# Extended advertising (upstream uses ble_gap_ext_adv_* / legacy-PDU ext adv).
CONFIG_BT_EXT_ADV=y

# GATT server with our static service definition.
CONFIG_BT_GATT_DYNAMIC_DB=n

# No GATT robust caching — upstream NimBLE has none. Robust caching adds the
# Database-Hash / Client-Supported-Features attributes and can answer a client's
# first request with ATT "Database Out Of Sync" (0x12); both diverge from the
# table NS2 expects. (Default is y on this Zephyr.)
CONFIG_BT_GATT_CACHING=n

# *** Match the genuine Pro2 ATT table: drop the default GAP/GATT services ***
# ROOT CAUSE of "controller never appears" (proven by symmetric [DIAG] capture):
# NS2 connects (itvl=12, same as upstream) and exchanges MTU, then — unlike with
# upstream — issues NO subscribe and NO command write. It discovers the GATT
# table, finds the mandatory Zephyr GAP(0x1800)+GATT(0x1801) services that a real
# Pro2 lacks (these also shift HID 0x000e->0x0018 and the cmd channel
# 0x0016->0x001f), and silently declines. Upstream omits both default services
# (gatt.c: // ble_svc_gap_init(); // ble_svc_gatt_init();), so its table is the
# exact Pro2 layout starting at 0x0001.
#   BT_GAP_SVC=n               removes the GAP 0x1800 service (config-only).
#   BT_GATT_GAP_SVC_VALIDATE=n drops the spec "exactly one GAP service" check;
#                              otherwise bt_enable() returns -EINVAL with 0 GAP svcs.
#   BT_GATT_SERVICE_CHANGED=n  shrinks the GATT 0x1801 service to a 1-handle stub.
# (Fully removing 0x1801 + re-adding the Pro2 vendor descriptors for an EXACT
#  handle match would need a small Zephyr-host patch; this config-only step is the
#  first experiment — the [DIAG] write/subscribe handles on the next NS2 attempt
#  show whether removing GAP is sufficient or exact handles are still required.)
CONFIG_BT_GAP_SVC=n
CONFIG_BT_GATT_GAP_SVC_VALIDATE=n
CONFIG_BT_GATT_SERVICE_CHANGED=n

# Security / bonding. Upstream injects a pre-derived LTK rather than running a
# standard pairing exchange; keep SMP + settings-backed bonding available.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# Match upstream's NS2 security model (src/device.c: sm_io_cap=NO_IO, sm_mitm=0,
# sm_sc=0 -> Just-Works, legacy-capable, UNauthenticated). Zephyr defaults the
# opposite (BT_SMP_ENFORCE_MITM=y and BT_SMP_SC_PAIR_ONLY=y, both `default y`),
# so the peripheral demands authenticated Secure-Connections-only pairing and
# would reject the console's Just-Works/legacy handshake -> no encryption -> the
# controller never registers on the Change Grip/Order screen. Disabling
# SC_PAIR_ONLY also compiles the legacy periph_ltk path in src/ble/ble_store.c
# so the injected NS2 LTK is served on the console's rand=0/ediv=0 enc request.
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Single connection (one NS2 console at a time).
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# BT RX work-queue stack. Incoming ATT (the GATT write callback ->
# cmd_process() -> cmd_0x15_handler()) runs here (CONFIG_BT_RECV_WORKQ_BT=y).
# The cmd-0x15 subcmd 0x02 path calls aes128_ecb() -> bt_encrypt_be(), which on
# this build resolves to the PSA/mbedTLS software AES (CONFIG_BT_HOST_CRYPTO=y,
# not the HCI LE-Encrypt path). That, plus the surrounding GATT/cmd processing,
# is deep enough to overflow the default 1200-byte stack and corrupt memory
# (observed: illegal-instruction fault in the scheduler ~1 ms after the
# subcmd-0x02 response, during the LTK exchange). Give it room.
CONFIG_BT_RX_STACK_SIZE=4096

# ATT MTU = 512 to match the genuine Pro2 (and upstream). The captured success
# trace shows NS2 negotiates MTU=512 then immediately reads 0x0003; our build
# negotiated only 247 and NS2 went silent right at that point. The server's RX
# ATT MTU is MIN(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU), and BT_L2CAP_RX_MTU =
# BT_BUF_ACL_RX_SIZE - 4, so the RX buffer must be >= 516 to advertise MTU 512.
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=516

# *** 5 ms (sub-spec) connection interval enabler (HOST side) ***
# Removes the host's interval_min>=6 (7.5 ms) validation so the peripheral can
# accept the NS2 console's sub-spec params via the le_param_req callback.
# The CONTROLLER side (ESP32-S3 blob) is a separate, currently-unsolved gate:
# see the feasibility notes at the top of src/ble/ble.c.
CONFIG_BT_CONN_PARAM_ANY=y

# Post-pairing/reconnect fast connection interval (units of 1.25 ms).
# 4 = 5 ms / 200 Hz, matching the interval NS2 uses natively in its fast mode.
# On wake/reconnect NS2 frequently settles on its ~30 ms power-save interval and
# nothing pulls it back down, so input lags. fast_interval_work_fn() requests
# this value once security reaches L4 (fresh-pair OR bonded reconnect), retrying
# a few times. The controller floor is 3.75 ms so a 5 ms grant is accepted.
CONFIG_JOY_BRIDGE_BLE_FAST_CONN_INTERVAL=4

# Use a fixed public identity address (upstream sets a Nintendo-prefixed MAC).
CONFIG_BT_PRIVACY=n

# ---- Console / logging UART -------------------------------------------------
# Serial console for boot logs and the [DIAG] BLE captures. Host input is not a
# UART byte stream — it comes from XInput over USB host (see below).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ---- USB host (XInput controller input) ------------------------------------
# Bring the on-chip ESP32-S3 USB-OTG core up in HOST mode (Full-Speed) and run
# the experimental Zephyr USB host stack, so a wired XInput (Xbox) controller
# plugged into the USB-OTG port drives the emulated Pro2.
#
# Upstream Zephyr has NO DWC2 host (UHC) driver for the S3 OTG core, so
# CONFIG_UHC_DWC2 selects the in-app uhc_dwc2_esp32 driver (and makes
# hal_espressif compile its USB wrapper HAL). USB host + UHC are EXPERIMENTAL
# (CONFIG_EXPERIMENTAL is auto-selected by USB_HOST_STACK / UHC_DRIVER).
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DRIVER=y
CONFIG_UHC_DWC2=y
CONFIG_JOY_BRIDGE_USB_XINPUT=y
